{% extends "layout.html" %}
{% load static %}
{% block title %}Register{% endblock %}
{% block p %}
  <!-- Hero Section with Background Image -->

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card mt-5">
            <div class="card-header text-center">
             
              <h3 style="color:black;">Signup</h3>
              {% block content %}
            {% for msg in messages  %}
            <div class="alert alert-{{msg.tags}} alert-dismissable fade show" role="alert">
             <strong>{{msg}}</strong>
             <button type="button" class="btn-close " data-bs-dismiss="alert" arial-label="Close"></button>
            </div>
            {% endfor %}
            {% endblock %} 
            </div>
            <div class="card-body">
              <form method="post" action="/auth/signup/">
                {% csrf_token %}
                <div class="form-group">
                  <label for="name">Full Name</label>
                  <input type="text" class="form-control" name="name" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                  <label for="email">Email address</label>
                  <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" name="pass1" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                  <label for="confirmPassword">Confirm Password</label>
                  <input type="password" class="form-control" name="pass2" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" name="btn" class="btn btn-primary btn-block mt-2">Register</button>
              </form>
            </div>
            <div class="card-footer text-center">
              <p style="color:black;">Already have an account? <a href="{% url 'login' %}">Login</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
 
{% endblock %}
