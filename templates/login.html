{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block p %}
  <!-- Hero Section with Background Image -->

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card mt-5">
            <div class="card-header text-center">
             
              <h3 style="color:black;">Login</h3>
              <p class="text-black-50 mb-2">Please enter your login and password!</p>
              {% block content %}
            {% for msg in messages  %}
            <div class="alert alert-{{msg.tags}} alert-dismissable fade show" role="alert">
             <strong>{{msg}}</strong>
             <button type="button" class="btn-close " data-bs-dismiss="alert" arial-label="Close"></button>
            </div>
            {% endfor %}
            {% endblock %} 
            </div>
            <div class="card-body">
              <form method="post" action="/auth/login/">
                {% csrf_token %}
                <div class="form-group">
                  <label for="email">Email address</label>
                  <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" name="pass1" id="password" placeholder="Enter your password" required>
                </div>
               
                <button type="submit" name="btn" class="btn btn-primary btn-block mt-2">Login</button>
                <p class="small mb-1 pb-lg-2"><a class="text-secondary-50" href="#!">Forgot password?</a></p>
              </form>
            </div>
            <div class="card-footer text-center">
              <p style="color:black;">Don't Have an Account? <a href="{% url 'signup' %}">Register</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
 
{% endblock %}
